apiVersion: v1
kind: Service
metadata: {name: {{ include "fines-database.fullname" . }}, namespace: {{ include "fines-database.namespace" . }}}
spec:
  clusterIP: None
  selector: {{- include "fines-database.selectorLabels" . | nindent 4 }}
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
