apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ include "cronjobs-database.fullname" . }}, namespace: {{ include "cronjobs-database.namespace" . }}}
spec:
  serviceName: {{ include "cronjobs-database.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cronjobs-database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cronjobs-database.selectorLabels" . | nindent 8 }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "cronjobs-database.fullname" . }}-credentials, key: postgres-user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "cronjobs-database.fullname" . }}-credentials, key: postgres-password}}
            - {name: POSTGRES_DB, value: {{ .Values.auth.database | quote }} }
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgresql, containerPort: 5432}]
          startupProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 5}
          livenessProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 10}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: {{ include "cronjobs-database.fullname" . }}-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.persistence.size }}}}
