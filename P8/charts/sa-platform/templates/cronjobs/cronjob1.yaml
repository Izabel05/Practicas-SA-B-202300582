{{- if .Values.cronjob1.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob1
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  schedule: {{ required "cronjob1.schedule es obligatorio" .Values.cronjob1.schedule | quote }}
  timeZone: {{ default "America/Guatemala" .Values.cronjob1.timeZone | quote }}
  concurrencyPolicy: {{ .Values.cronjob1.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob1.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob1.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob1.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cronjob1
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: cronjob1
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cronjob1
              image: "{{ .Values.cronjob1.image.repository }}:{{ .Values.cronjob1.image.tag }}"
              imagePullPolicy: {{ .Values.cronjob1.image.pullPolicy }}
              command: ["/scripts/insert-execution.sh"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.cronjob1.database.secretName }}
                      key: {{ .Values.cronjob1.database.secretKey }}
                - {name: STUDENT_ID, value: {{ required "cronjob1.studentId es obligatorio" .Values.cronjob1.studentId | quote }}}
                - {name: TZ, value: America/Guatemala}
                - {name: HOME, value: /tmp}
              resources:
                {{- toYaml .Values.cronjob1.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: cronjob1-script, defaultMode: 0555}
            - name: tmp
              emptyDir: {}
{{- end }}
