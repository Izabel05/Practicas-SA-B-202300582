{{- if .Values.externalSecrets.enabled }}
{{- $namespace := .Values.global.namespace }}
{{- $store := .Values.externalSecrets.secretStoreName }}
{{- $interval := .Values.externalSecrets.refreshInterval }}
{{- range $item := list
  (dict "name" "auth-postgresql-credentials" "keys" (list "postgres-user" "postgres-password" "database-url"))
  (dict "name" "catalog-postgresql-credentials" "keys" (list "postgres-user" "postgres-password" "database-url"))
  (dict "name" "loans-postgresql-credentials" "keys" (list "postgres-user" "postgres-password" "database-url"))
  (dict "name" "fines-postgresql-credentials" "keys" (list "postgres-user" "postgres-password" "database-url"))
  (dict "name" "cronjobs-postgresql-credentials" "keys" (list "postgres-user" "postgres-password" "database-url"))
  (dict "name" "rabbitmq-credentials" "keys" (list "rabbitmq-user" "rabbitmq-password" "amqp-url"))
  (dict "name" "jwt-credentials" "keys" (list "JWT_SECRET"))
}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: {{ $interval }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ $item.name }}
    creationPolicy: Owner
  data:
  {{- range $key := $item.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: p8/{{ $item.name }}/{{ $key }}
  {{- end }}
---
{{- end }}
{{- end }}
