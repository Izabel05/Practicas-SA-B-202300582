{{- $gateway := index .Values "api-gateway" }}
{{- if $gateway.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-health
  namespace: {{ .Values.global.namespace }}
spec:
  metrics:
    - name: gateway-health
      interval: 10s
      count: 3
      successCondition: result[0] == 1
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: health-check
                    image: curlimages/curl:8.10.1
                    command: [sh, -c]
                    args:
                      - >-
                        curl --fail --silent --show-error --max-time 5
                        http://api-gateway-canary:8080/health >/dev/null
                        && echo 1 || echo 0
{{- end }}
