openapi: 3.0.3
info:
  title: API de Autenticación
  version: 1.0.0
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      summary: Comprueba el estado del servicio
      responses:
        "200":
          description: Servicio disponible
  /api/v1/auth/register:
    post:
      summary: Registra un lector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Datos inválidos
        "409":
          description: Correo ya registrado
  /api/v1/auth/login:
    post:
      summary: Inicia sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Credenciales inválidas
components:
  schemas:
    RegisterRequest:
      type: object
      required: [nombre, apellido, correo, password]
      properties:
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id_usuario:
          type: string
          format: uuid
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [ADMIN, LECTOR]
        activo:
          type: boolean
