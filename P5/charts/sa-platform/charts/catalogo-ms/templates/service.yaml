apiVersion: v1
kind: Service
metadata:
  name: {{ include "catalogo-ms.fullname" . }}
  namespace: {{ include "catalogo-ms.namespace" . }}
  labels:
    {{- include "catalogo-ms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "catalogo-ms.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

