{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "catalogo-ms.serviceAccountName" . }}
  namespace: {{ include "catalogo-ms.namespace" . }}
  labels:
    {{- include "catalogo-ms.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

