apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multas-ms.fullname" . }}
  namespace: {{ include "multas-ms.namespace" . }}
  labels: {{- include "multas-ms.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FINE_DAILY_RATE: {{ .Values.config.dailyRate | quote }}
  FINE_QUEUE: {{ .Values.rabbitmq.queue | quote }}
