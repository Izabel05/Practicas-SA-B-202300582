apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "autenticacion-ms.fullname" . }}
  namespace: {{ include "autenticacion-ms.namespace" . }}
  labels:
    {{- include "autenticacion-ms.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "autenticacion-ms.fullname" . }}
  namespace: {{ include "autenticacion-ms.namespace" . }}
  labels:
    {{- include "autenticacion-ms.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "autenticacion-ms.serviceAccountName" . }}
    namespace: {{ include "autenticacion-ms.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "autenticacion-ms.fullname" . }}

