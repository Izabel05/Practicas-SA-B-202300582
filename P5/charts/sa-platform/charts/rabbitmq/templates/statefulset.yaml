apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ include "rabbitmq.fullname" . }}, namespace: {{ include "rabbitmq.namespace" . }}}
spec:
  serviceName: {{ include "rabbitmq.fullname" . }}
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: rabbitmq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: rabbitmq-credentials, key: rabbitmq-user}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: rabbitmq-credentials, key: rabbitmq-password}}
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          startupProbe: {exec: {command: ["rabbitmq-diagnostics","-q","ping"]}, failureThreshold: 60, periodSeconds: 3, timeoutSeconds: 5}
          readinessProbe: {exec: {command: ["rabbitmq-diagnostics","-q","check_running"]}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {exec: {command: ["rabbitmq-diagnostics","-q","ping"]}, periodSeconds: 20, timeoutSeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: {{ .Values.persistence.size }}}}}
