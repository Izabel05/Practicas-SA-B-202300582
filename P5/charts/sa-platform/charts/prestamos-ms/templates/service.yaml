apiVersion: v1
kind: Service
metadata:
  name: {{ include "prestamos-ms.fullname" . }}
  namespace: {{ include "prestamos-ms.namespace" . }}
  labels: {{- include "prestamos-ms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "prestamos-ms.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
