{{- if .Values.cronjob2.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: cronjob2, namespace: {{ include "sa-platform.namespace" . }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cronjob2, namespace: {{ include "sa-platform.namespace" . }}}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cronjob2, namespace: {{ include "sa-platform.namespace" . }}}
subjects:
  - {kind: ServiceAccount, name: cronjob2, namespace: {{ include "sa-platform.namespace" . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cronjob2}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: summary-consumer, namespace: {{ include "sa-platform.namespace" . }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: summary-consumer, namespace: {{ include "sa-platform.namespace" . }}}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: summary-consumer, namespace: {{ include "sa-platform.namespace" . }}}
subjects:
  - {kind: ServiceAccount, name: summary-consumer, namespace: {{ include "sa-platform.namespace" . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: summary-consumer}
{{- end }}
