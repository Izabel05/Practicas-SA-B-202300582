{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "sa-platform.fullname" . }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        {{- toYaml .Values.limitRange.container.defaultRequest | nindent 8 }}
      default:
        {{- toYaml .Values.limitRange.container.default | nindent 8 }}
      min:
        {{- toYaml .Values.limitRange.container.min | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.container.max | nindent 8 }}
    - type: PersistentVolumeClaim
      min:
        {{- toYaml .Values.limitRange.persistentVolumeClaim.min | nindent 8 }}
      max:
        {{- toYaml .Values.limitRange.persistentVolumeClaim.max | nindent 8 }}
{{- end }}
