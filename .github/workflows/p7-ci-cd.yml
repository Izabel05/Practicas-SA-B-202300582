name: P7 CI-CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: p7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: 0 - Preparacion y version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Determinar version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version del pipeline: $version"
      - name: Validar distribucion 70/20 de pruebas
        run: python P7/scripts/validate-test-distribution.py

  build-go:
    name: 1 - Build Go - ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [autenticacion-ms, catalogo-ms]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: P4/Backend/${{ matrix.service }}/go.mod
          cache-dependency-path: P4/Backend/${{ matrix.service }}/go.sum
      - name: Compilar servicio
        working-directory: P4/Backend/${{ matrix.service }}
        run: go build ./...

  build-python:
    name: 1 - Build Python - ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: prestamos-ms, path: P4/Backend/prestamos-ms, python-version: "3.13"}
          - {service: multas-ms, path: P4/Backend/multas-ms, python-version: "3.12"}
          - {service: cronjobs-worker, path: P6/cronjobs/cronjob2, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - name: Instalar dependencias
        working-directory: ${{ matrix.path }}
        run: python -m pip install -r requirements.txt
      - name: Compilar servicio o worker
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          if [[ -d app ]]; then
            python -m compileall -q app
          else
            python -m py_compile worker.py
          fi

  test-go:
    name: 2 - Pruebas Go 70/20 - ${{ matrix.service }}
    needs: build-go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: autenticacion-ms
            unit_pattern: ^Test(RegisterCreatesReaderAndReturnsToken|LoginRejectsInactiveUser)$
            integration_pattern: ^TestRegisterEndpoint$
          - service: catalogo-ms
            unit_pattern: ^Test(CreateCategoryTrimsInput|UpdateCopyStatusNormalizesValue)$
            integration_pattern: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: P4/Backend/${{ matrix.service }}/go.mod
          cache-dependency-path: P4/Backend/${{ matrix.service }}/go.sum
      - name: Pruebas unitarias
        working-directory: P4/Backend/${{ matrix.service }}
        run: go test -v ./internal/service -run '${{ matrix.unit_pattern }}'
      - name: Pruebas de integracion
        if: matrix.integration_pattern != ''
        working-directory: P4/Backend/${{ matrix.service }}
        run: go test -v ./internal/controller -run '${{ matrix.integration_pattern }}'

  test-python:
    name: 2 - Pruebas Python 70/20 - ${{ matrix.service }}
    needs: build-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: prestamos-ms
            python-version: "3.13"
            unit_targets: >-
              tests.test_loan_service.LoanServiceTests.test_create_loan_reserves_copy
              tests.test_loan_service.LoanServiceTests.test_return_copy_releases_catalog_copy
            integration_targets: tests.test_graphql.GraphQLTests.test_query_loan
          - service: multas-ms
            python-version: "3.12"
            unit_targets: tests.test_fine_service.FineServiceTests.test_calculates_amount_by_overdue_days
            integration_targets: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: P4/Backend/${{ matrix.service }}/requirements.txt
      - name: Instalar dependencias
        working-directory: P4/Backend/${{ matrix.service }}
        run: python -m pip install -r requirements.txt
      - name: Pruebas unitarias
        working-directory: P4/Backend/${{ matrix.service }}
        run: python -m unittest -v ${{ matrix.unit_targets }}
      - name: Pruebas de integracion
        if: matrix.integration_targets != ''
        working-directory: P4/Backend/${{ matrix.service }}
        run: python -m unittest -v ${{ matrix.integration_targets }}

  build-publish:
    name: 3 - Docker - ${{ matrix.image }}
    needs: [test-go, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: api-gateway, context: P4/Backend/api-gateway}
          - {image: autenticacion-ms, context: P4/Backend/autenticacion-ms}
          - {image: catalogo-ms, context: P4/Backend/catalogo-ms}
          - {image: prestamos-ms, context: P4/Backend/prestamos-ms}
          - {image: multas-ms, context: P4/Backend/multas-ms}
          - {image: cronjobs-worker, context: P6/cronjobs/cronjob2}
    steps:
      - uses: actions/checkout@v7
      - name: Normalizar nombre de la imagen
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/sa-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Iniciar sesion en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparar etiquetas y metadatos
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
