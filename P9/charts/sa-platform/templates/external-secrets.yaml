{{- if .Values.externalSecrets.enabled }}
{{- $namespace := .Values.global.namespace }}
{{- $store := .Values.externalSecrets.secretStoreName }}
{{- $interval := .Values.externalSecrets.refreshInterval }}
{{- $prefix := default "p9" .Values.externalSecrets.remoteKeyPrefix }}
{{- range $item := list
  (dict "name" "auth-postgresql-credentials")
  (dict "name" "catalog-postgresql-credentials")
  (dict "name" "loans-postgresql-credentials")
  (dict "name" "fines-postgresql-credentials")
  (dict "name" "cronjobs-postgresql-credentials")
  (dict "name" "rabbitmq-credentials")
  (dict "name" "jwt-credentials")
}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: {{ $interval }}
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ $item.name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $prefix }}-{{ $item.name }}
---
{{- end }}
{{- end }}

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.global.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ default "p9" .Values.externalSecrets.remoteKeyPrefix }}-ghcr-dockerconfigjson
