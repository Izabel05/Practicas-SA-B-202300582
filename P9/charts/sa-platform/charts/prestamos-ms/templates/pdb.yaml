{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "prestamos-ms.fullname" . }}
  namespace: {{ include "prestamos-ms.namespace" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "prestamos-ms.selectorLabels" . | nindent 6 }}
{{- end }}
