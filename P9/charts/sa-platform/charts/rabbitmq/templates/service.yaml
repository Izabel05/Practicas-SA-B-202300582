apiVersion: v1
kind: Service
metadata: {name: {{ include "rabbitmq.fullname" . }}, namespace: {{ include "rabbitmq.namespace" . }}}
spec:
  selector: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: amqp, port: 5672, targetPort: amqp}, {name: management, port: 15672, targetPort: management}]
