{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # GKE puede aplicar la NetworkPolicy antes de traducir la IP virtual del
    # servicio kube-dns. Limitar por selector de Pod bloquea en ese caso la IP
    # ClusterIP del DNS. Se permite solamente el puerto DNS, sin restringir el
    # destino, para que funcione con kube-dns y con el DNS administrado de GKE.
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
