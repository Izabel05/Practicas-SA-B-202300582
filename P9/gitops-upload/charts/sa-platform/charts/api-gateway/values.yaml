replicaCount: 2

platformVersion: "0.2.1"

fullnameOverride: ""

image:
  repository: ghcr.io/izabel05/sa-api-gateway
  pullPolicy: IfNotPresent
  tag: "v1.2.2"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

upstreams:
  resolver: kube-dns.kube-system.svc.cluster.local
  autenticacion: autenticacion-ms:8081
  catalogo: catalogo-ms:8082
  prestamos: prestamos-ms:8083
  multas: multas-ms:8084

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
