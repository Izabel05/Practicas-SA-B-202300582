openapi: 3.0.3
info:
  title: API REST de Multas
  version: 1.0.0
servers:
  - url: http://localhost:8084
paths:
  /health:
    get:
      summary: Comprueba el estado del servicio
      responses:
        "200":
          description: Servicio disponible
  /api/v1/multas:
    post:
      summary: Crea de forma idempotente una multa por préstamo vencido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFineRequest"
      responses:
        "201":
          description: Multa creada o recuperada
        "422":
          description: Solicitud inválida
  /api/v1/multas/{fine_id}:
    get:
      summary: Consulta una multa
      parameters:
        - $ref: "#/components/parameters/FineId"
      responses:
        "200":
          description: Multa encontrada
        "404":
          description: Multa no encontrada
  /api/v1/multas/{fine_id}/pagar:
    patch:
      summary: Marca una multa pendiente como pagada
      parameters:
        - $ref: "#/components/parameters/FineId"
      responses:
        "200":
          description: Multa pagada
        "409":
          description: La multa no está pendiente
  /api/v1/usuarios/{user_id}/multas:
    get:
      summary: Consulta las multas de un usuario
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Listado de multas
components:
  parameters:
    FineId:
      in: path
      name: fine_id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateFineRequest:
      type: object
      required: [id_prestamo, id_usuario, dias_atraso]
      properties:
        id_prestamo:
          type: string
          format: uuid
        id_usuario:
          type: string
          format: uuid
        dias_atraso:
          type: integer
          minimum: 1
        fecha_generacion:
          type: string
          format: date-time
