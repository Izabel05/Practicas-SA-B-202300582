events {}

http {
    server {
        listen 8080;
        server_name _;

        default_type application/json;
        client_max_body_size 1m;

        location = /health {
            return 200 '{"status":"ok","servicio":"api-gateway"}';
        }

        location = /health/auth {
            proxy_pass http://autenticacion-ms:8081/health;
        }

        location = /health/catalogo {
            proxy_pass http://catalogo-ms:8082/health;
        }

        location = /health/prestamos {
            proxy_pass http://prestamos-ms:8083/health;
        }

        location = /health/multas {
            proxy_pass http://multas-ms:8084/health;
        }

        location ^~ /api/v1/auth/ {
            proxy_pass http://autenticacion-ms:8081;
        }

        location ^~ /api/v1/ejemplares/ {
            proxy_pass http://catalogo-ms:8082;
        }

        location ^~ /api/v1/prestamos/ {
            proxy_pass http://prestamos-ms:8083;
        }

        location = /api/v1/multas {
            proxy_pass http://multas-ms:8084;
        }

        location ^~ /api/v1/multas/ {
            proxy_pass http://multas-ms:8084;
        }

        location ~ ^/api/v1/usuarios/[^/]+/multas$ {
            proxy_pass http://multas-ms:8084;
        }

        location = /catalogo/graphql {
            proxy_pass http://catalogo-ms:8082/graphql;
        }

        location = /prestamos/graphql {
            proxy_pass http://prestamos-ms:8083/graphql;
        }

        location / {
            return 404 '{"error":"RUTA_NO_ENCONTRADA","mensaje":"La ruta no existe en el API Gateway"}';
        }
    }
}

