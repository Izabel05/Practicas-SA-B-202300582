openapi: 3.0.3
info:
  title: API REST interna de Catálogo
  version: 1.0.0
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Comprueba el estado del servicio
      responses:
        "200":
          description: Servicio disponible
  /api/v1/ejemplares/{id}/estado:
    patch:
      summary: Actualiza el estado de un ejemplar desde Préstamos
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [DISPONIBLE, PRESTADO, MANTENIMIENTO]
      responses:
        "200":
          description: Ejemplar actualizado
        "400":
          description: Estado o identificador inválido
        "404":
          description: Ejemplar no encontrado
