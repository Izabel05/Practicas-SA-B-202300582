{{- if .Values.cronjob1.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: cronjob1, namespace: {{ include "sa-platform.namespace" . }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cronjob1, namespace: {{ include "sa-platform.namespace" . }}}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cronjob1, namespace: {{ include "sa-platform.namespace" . }}}
subjects:
  - {kind: ServiceAccount, name: cronjob1, namespace: {{ include "sa-platform.namespace" . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cronjob1}
{{- end }}
