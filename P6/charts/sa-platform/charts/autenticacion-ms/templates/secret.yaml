{{- if not .Values.auth.secretName -}}
{{- $name := printf "%s-credentials" (include "autenticacion-ms.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" (include "autenticacion-ms.namespace" .) $name -}}
{{- $jwtSecret := .Values.auth.jwtSecret -}}
{{- if and (not $jwtSecret) $existing -}}
{{- $jwtSecret = (index $existing.data "JWT_SECRET" | b64dec) -}}
{{- else if not $jwtSecret -}}
{{- $jwtSecret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "autenticacion-ms.namespace" . }}
  labels:
    {{- include "autenticacion-ms.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ $jwtSecret | quote }}
{{- end }}
