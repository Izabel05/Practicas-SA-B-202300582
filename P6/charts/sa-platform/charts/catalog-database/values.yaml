fullnameOverride: ""

image:
  repository: postgres
  tag: "17-alpine"
  pullPolicy: IfNotPresent

auth:
  username: catalog_user
  password: ""
  database: catalog_db

service:
  port: 5432

persistence:
  size: 2Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20

