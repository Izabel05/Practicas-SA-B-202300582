{{- $name := printf "%s-credentials" (include "auth-database.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" (include "auth-database.namespace" .) $name -}}
{{- $password := .Values.auth.password -}}
{{- if and (not $password) $existing -}}
{{- $password = (index $existing.data "postgres-password" | b64dec) -}}
{{- else if not $password -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "auth-database.namespace" . }}
  labels:
    {{- include "auth-database.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ .Values.auth.username | quote }}
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s:%v/%s?sslmode=disable" .Values.auth.username $password (include "auth-database.fullname" .) .Values.service.port .Values.auth.database | quote }}

