{{- $existing := lookup "v1" "Secret" (include "rabbitmq.namespace" .) "rabbitmq-credentials" -}}
{{- $password := .Values.auth.password -}}
{{- if and (not $password) $existing }}{{- $password = (index $existing.data "rabbitmq-password" | b64dec) -}}{{- else if not $password }}{{- $password = randAlphaNum 32 -}}{{- end }}
apiVersion: v1
kind: Secret
metadata: {name: rabbitmq-credentials, namespace: {{ include "rabbitmq.namespace" . }}}
type: Opaque
stringData:
  rabbitmq-user: {{ .Values.auth.username | quote }}
  rabbitmq-password: {{ $password | quote }}
  amqp-url: {{ printf "amqp://%s:%s@%s:5672/%%2F" .Values.auth.username $password (include "rabbitmq.fullname" .) | quote }}
